# VisionQC Pipeline Parameters for DVC reproducibility

preprocessing:
  image_size: [224, 224]
  grayscale: false
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  random_seed: 42

training:
  model_architecture: "efficientnet_b0"
  batch_size: 32
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  device: "cuda"

quality_gate:
  min_f1_score: 0.95
  max_inference_latency_ms: 50.0
