services:
  # 1. FastAPI Backend (Model Serving + Metrics + Database)
  - type: web
    name: visionqc-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: APP_ENV
        value: "production"
      - key: ACTIVE_MODEL_PATH
        value: "ml/models/saved/efficientnet_b0_candidate.pth"
      - key: DATABASE_URL
        value: "sqlite:///./visionqc_app.db"
    plan: free

  # 2. Next.js Frontend Dashboard (App Router)
  - type: web
    name: visionqc-frontend
    env: node
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: visionqc-backend
          property: host
    plan: free
